[tool.poetry]
name = "agentic-customer-contact"
version = "2.0.0"
description = "An agentic ai system to help deal with customer tickets"
authors = ["Ashish Pandey <ashishpandey.nitt@gmail.com>"]
readme = "README.md"
packages = [
    { include = "agentic_customer_contact", from = "src"},
    ]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
semantic-kernel = "^1.39.4"
openai = "<2.0.0"
pytest-asyncio = "^1.3.0"
python-dotenv = "^1.2.1"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
autodoc-pydantic = ">=1.8,<3"
black = "^24"
flake8 = "^7"
flake8-annotations = "^3"
flake8-black = "^0.3.2"
flake8-bugbear = "^24"
flake8-cognitive-complexity = "^0.1.0"
flake8-comprehensions = "^3.3.1"
flake8-debugger = "^4.0.0"
flake8-docstrings = "^1.5.0"
flake8-formatter-junit-xml = "^0.0.6"
flake8-isort = "^6"
flake8-mutable = "^1.2.0"
flake8-simplify = "^0.21"
flake8-super = "^0.1.3"
isort = "^5.7.0"
pep8-naming = "^0.14"
poethepoet = "^0.29"
pytest = "^8"
pytest-cov = "^5"
sphinx = ">=6,<9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.poe.tasks]
test = {cmd = "pytest --cov=src/agentic_customer_contact --cov-config=pyproject.toml", help = "Run test suite"}
lint = {cmd = "flake8 --max-cognitive-complexity=15 src", help = "Lint and complexity score for source code"}
black = {cmd = "black src tests", help = "Format source code"}
isort = {cmd = "isort src tests", help = "Sort imports"}
format = {sequence = ["isort", "black"], help = "Format source code & sort imports"}
